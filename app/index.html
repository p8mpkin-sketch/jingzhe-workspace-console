<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>惊蛰 Jingzhe Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/v2/brand/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/v2/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/v2/brand/favicon-16.png" />
    <link rel="shortcut icon" href="/v2/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="/v2/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="" />
    <script>
      // Apply the stored theme, or the system preference when none is stored, before first paint (no flash). Colors come from the token stylesheet.
      (function () {
        try {
          var t = localStorage.getItem('apksec-theme');
          if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'light') document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // R50 P0-4: v1 退役深链兼容 —— /#pentest 经 302 保留 fragment 到 /v2/#pentest,规范化为 #/pentest
      (function () {
        var h = location.hash || '';
        if (h && h !== '#' && h.indexOf('#/') !== 0) {
          location.replace('/v2/#/' + h.replace(/^#\/?/, ''));
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
